name: Fire TV test APK
on:
  push:
    branches: [main, feature/ddp-event-effects, feature/v0.6-following]
    paths:
      - 'firetv/**'
      - '.github/workflows/firetv-apk.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK platform (using runner SDK)
        run: |
          SDKMGR=$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | head -n 1)
          test -x "$SDKMGR"
          "$SDKMGR" --install 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: JVM tests and assemble APK
        working-directory: firetv
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Verify APK and checksum
        run: |
          test -s firetv/app/build/outputs/apk/debug/app-debug.apk
          cp firetv/app/build/outputs/apk/debug/app-debug.apk GlowDeck-GameDay-FireTV-v0.7.0.apk
          sha256sum GlowDeck-GameDay-FireTV-v0.7.0.apk > firetv-v0.7.0.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: GlowDeck-GameDay-FireTV-v0.7.0-debug-APK
          path: |
            GlowDeck-GameDay-FireTV-v0.7.0.apk
            firetv-v0.7.0.sha256
          retention-days: 90
      - name: Publish standalone Fire TV v0.7.0 test release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=firetv-v0.7.0-test
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title 'GlowDeck GameDay Fire TV v0.7.0 (background monitoring test)' --prerelease --latest=false \
              --notes 'v0.7 adds separate ESP32 web pages for Games, Following, Lights, Sound and Setup, with return-to-page forms. Fire TV gains a dedicated Following tab. v0.6 monitoring and output routing are retained. Hardware navigation testing remains required.'
          fi
          gh release upload "$TAG" GlowDeck-GameDay-FireTV-v0.7.0.apk firetv-v0.7.0.sha256 --clobber
