name: Fire TV test APK
on:
  push:
    branches: [main]
    paths:
      - 'firetv/**'
      - '.github/workflows/firetv-apk.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK platform (using runner SDK)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Native JVM tests and assemble APK
        working-directory: firetv
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Verify signed APK and compute checksum
        run: |
          test -s firetv/app/build/outputs/apk/debug/app-debug.apk
          sha256sum firetv/app/build/outputs/apk/debug/app-debug.apk | tee firetv-apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: GlowDeck-GameDay-FireTV-v0.1-debug-APK
          path: |
            firetv/app/build/outputs/apk/debug/app-debug.apk
            firetv-apk.sha256
          retention-days: 90
      - name: Publish prerelease sideloadable APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=firetv-v0.1.0-test
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title 'GlowDeck GameDay Fire TV v0.1 (test)' --prerelease --latest=false \
              --notes 'NHL/WLED diagnostic Fire TV app. This APK uses a CI DEBUG signature that can change between builds. Uninstall the prior test build before installing an updated APK if the signature differs. No automatic goal reactions until explicitly armed.'
          fi
          gh release upload "$TAG" 'firetv/app/build/outputs/apk/debug/app-debug.apk#GlowDeck-GameDay-FireTV-v0.1.apk' firetv-apk.sha256 --clobber
