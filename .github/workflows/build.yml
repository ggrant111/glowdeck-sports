name: Build and test GameDay firmware
on:
  push:
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:
jobs:
  platformio:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        board: [cyd, cyd_ili9342, cyd_st7789, boot_probe]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO
        run: pip install platformio
      - name: Run portable tests
        run: pio test -e native
      - name: Check touch coordinate transforms
        run: c++ -std=c++17 -Iinclude scripts/check-touch.cpp -o /tmp/check-touch && /tmp/check-touch
      - name: Check clock formats
        run: c++ -std=c++17 -Iinclude scripts/check-clock.cpp -o /tmp/check-clock && /tmp/check-clock
      - name: Compile CYD firmware
        run: pio run -e ${{ matrix.board }}
      - name: Check bounded play-by-play parser
        run: c++ -std=c++17 -Iinclude -I.pio/libdeps/${{ matrix.board }}/ArduinoJson/src scripts/check-pbp-stream.cpp -o /tmp/check-pbp && /tmp/check-pbp
      - name: Upload flashable image
        uses: actions/upload-artifact@v4
        with:
          name: GlowDeck-GameDay-v0.8.2-${{ matrix.board }}-firmware
          path: |
            .pio/build/${{ matrix.board }}/firmware.bin
            .pio/build/${{ matrix.board }}/firmware.elf
