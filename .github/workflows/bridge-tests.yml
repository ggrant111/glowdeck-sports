name: Local bridge tests
on:
  push:
    paths:
      - 'tools/**'
      - '.github/workflows/bridge-tests.yml'
  pull_request:
    paths:
      - 'tools/**'
      - '.github/workflows/bridge-tests.yml'
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tools/tests -v
