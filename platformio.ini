; GlowDeck GameDay v0.1 — ESP32-2432S028R (2.8in CYD resistive touch)
[platformio]
default_envs = cyd
src_dir = src
include_dir = include

[env:cyd]
platform = espressif32@6.4.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_build.flash_mode = dio
lib_deps =
  bodmer/TFT_eSPI@2.5.43
  https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#f956c5d8ce3bf39169c7378416b89e7cfe70a034
  bblanchon/ArduinoJson@^6.21.5
  tzapu/WiFiManager@^2.0.17
build_flags =
  -DUSER_SETUP_LOADED=1
  -DILI9341_DRIVER=1
  -DTFT_WIDTH=240
  -DTFT_HEIGHT=320
  -DTFT_MISO=12
  -DTFT_MOSI=13
  -DTFT_SCLK=14
  -DTFT_CS=15
  -DTFT_DC=2
  -DTFT_RST=-1
  -DTFT_BL=21
  -DSPI_FREQUENCY=40000000
  -DSPI_READ_FREQUENCY=20000000
  -DSPI_TOUCH_FREQUENCY=2500000
  -DUSE_HSPI_PORT=1
  -DLOAD_GLCD=1
  -DLOAD_FONT2=1
  -DLOAD_FONT4=1
  -DLOAD_GFXFF=1
  -DSMOOTH_FONT=1
  -DCORE_DEBUG_LEVEL=1
build_src_filter = +<*> 

; Native core tests — no Arduino dependencies or ESP32 hardware.
[env:native]
platform = native
; Include src/GameCore.cpp when linking native Unity tests.
test_build_src = yes
test_framework = unity
build_src_filter = +<GameCore.cpp>
lib_deps =
build_flags = -std=gnu++17
